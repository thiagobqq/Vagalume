services:
  postgres:
    image: postgres:16-alpine
    container_name: vagalume-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-vagalume}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
      POSTGRES_DB: "${POSTGRES_DB:-vagalume}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vagalume} -d ${POSTGRES_DB:-vagalume}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vagalume

  api:
    build:
      context: ./backend
      dockerfile: src/Vagalume.Api/Dockerfile
    container_name: vagalume-api
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vagalume};Username=${POSTGRES_USER:-vagalume};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vagalume

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # vazio => frontend usa /api relativo e nginx faz proxy para api:8080
        # para expor API externa, defina: VITE_API_URL=http://localhost:5000
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    container_name: vagalume-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - vagalume

  # Opcional para dev local: docker compose --profile observability up
  # Defina OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889 no .env
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: vagalume-aspire-dashboard
    profiles:
      - observability
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
    networks:
      - vagalume

volumes:
  postgres_data:
  uploads_data:

networks:
  vagalume:
    driver: bridge
