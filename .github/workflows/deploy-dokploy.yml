name: Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dokploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        run: |
          curl -fsS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
