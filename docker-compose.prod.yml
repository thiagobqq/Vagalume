services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-vagalume}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-vagalume}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vagalume} -d ${POSTGRES_DB:-vagalume}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vagalume

  api:
    build:
      context: ./backend
      dockerfile: src/Vagalume.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vagalume};Username=${POSTGRES_USER:-vagalume};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?defina JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-vagalume}"
      Jwt__Audience: "${JWT_AUDIENCE:-vagalume}"
      Seguranca__ChaveCripto: "${SEGURANCA_CHAVE_CRIPTO:?defina SEGURANCA_CHAVE_CRIPTO}"
      Authentication__Google__ClientId: "${AUTHENTICATION_GOOGLE_CLIENTID:-}"
      Ia__Presets__OllamaBaseUrl: "${IA_PRESETS_OLLAMA_BASE_URL:-}"
      Busca__Agente__UrlPublica: "${Busca__Agente__UrlPublica:-}"
      Uploads__BasePath: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vagalume

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # vazio => frontend usa /api relativo e nginx faz proxy para api:8080
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - vagalume
      - dokploy-network
    labels:
      # garante que o Traefik use a dokploy-network para achar o IP do container
      - traefik.docker.network=dokploy-network

volumes:
  postgres_data:
  uploads_data:

networks:
  vagalume:
    driver: bridge
  dokploy-network:
    external: true
